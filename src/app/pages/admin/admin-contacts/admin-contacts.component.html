<div class="contacts-container">
  <h2 class="page-title">Contact Requests</h2>

  <div class="table-wrapper" *ngIf="contacts && contacts.length; else noData">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Subject</th>
          <th>Message</th>
          <th>Date</th>
          <th class="action-column">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of contacts">
          <td>{{ c.name }}</td>
          <td>{{ c.email }}</td>
          <td>{{ c.subject }}</td>
          <td class="message-cell">{{ c.message }}</td>
          <td>{{ c.createdAt | date:'medium' }}</td>
          <td>
            <button class="delete-btn" (click)="deleteContact(c._id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noData>
    <p class="no-data">No contact requests found.</p>
  </ng-template>
</div>
